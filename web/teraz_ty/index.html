<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotoRent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav">
  <div class="logo" onclick="location.href='index.html'">MotoRent</div>
  <nav>
    <a href="index.html">Domov</a>
    <a href="#produkty">Motorky</a>
  </nav>
</header>

<section class="hero">
  <h2>Prémiové 125cc požičanie</h2>
  <p>Moderný spôsob jazdenia bez kúpy</p>
  <button onclick="document.getElementById('produkty').scrollIntoView({behavior:'smooth'})">Pozrieť ponuku</button>
</section>

<section id="produkty" class="grid">
  <div class="card" onclick="openPage('supersport')">
    <img src="https://images.unsplash.com/photo-1611242320536-f12d3541249b">
    <h3>Supersport</h3>
  </div>

  <div class="card" onclick="openPage('supermoto')">
    <img src="https://images.unsplash.com/photo-1609630875171-b1321377ee65">
    <h3>Supermoto</h3>
  </div>

  <div class="card" onclick="openPage('naked')">
    <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39">
    <h3>Naked</h3>
  </div>
</section>

<script>
function openPage(type){
  window.location.href="list.html?type="+type;
}
</script>

</body>
</html>
